<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,300;1,500&display=swap" rel="stylesheet">
<style>
:root{--sky1:#fbe1d4;--sky2:#f1b4c8;--glow:#fff3c4;--hill1:#86ad6a;--hill2:#5f9158;--stem:#4f8a4f;--ink:#4a2a3a;--card:rgba(255,248,250,.8);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#15122e;--sky2:#43285a;--glow:#d9d2ff;--hill1:#2b4a3c;--hill2:#1d3a30;--stem:#4f9a6f;--ink:#f8e9f2;--card:rgba(32,24,60,.74)}}
:root[data-theme="dark"]{--sky1:#15122e;--sky2:#43285a;--glow:#d9d2ff;--hill1:#2b4a3c;--hill2:#1d3a30;--stem:#4f9a6f;--ink:#f8e9f2;--card:rgba(32,24,60,.74)}
html,body{height:100%;margin:0}
body{background:var(--sky1);color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
button{font:inherit;font-size:18px;cursor:pointer;border-radius:999px;padding:8px 20px;color:var(--ink);background:var(--card);border:1px solid rgba(120,80,100,.3);border:1px solid color-mix(in srgb,var(--ink) 28%,transparent);backdrop-filter:blur(6px)}
button:focus-visible{outline:2px solid currentColor;outline-offset:3px}
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px 24px 18vh;text-align:center;color:#fff4f8;transition:opacity 1.8s ease}
#intro.gone{opacity:0;pointer-events:none}
#intro h1{margin:0;font-weight:300;font-style:italic;font-size:clamp(56px,15vw,128px);line-height:1;letter-spacing:-.02em}
#intro p{margin:0 0 18px;font-size:clamp(19px,3.6vw,25px);opacity:.85;font-style:italic}
#open{color:#fff4f8;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.6);font-size:21px;padding:10px 36px}
#bar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;display:flex;gap:8px;opacity:0;pointer-events:none;transition:opacity 1.5s 3s}
#bar.show{opacity:1;pointer-events:auto}
#card{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:min(34rem,calc(100% - 32px));box-sizing:border-box;padding:16px 22px 14px;text-align:center;background:var(--card);backdrop-filter:blur(8px);border:1px solid rgba(120,80,100,.2);border-radius:22px;opacity:0;transform:translate(-50%,14px);transition:opacity 1.4s,transform 1.4s;pointer-events:none}
#card.show{opacity:1;transform:translate(-50%,0)}
#card h2{margin:0 0 4px;font-weight:500;font-style:italic;font-size:clamp(27px,5vw,35px);line-height:1.1}
#card p{margin:0;font-size:clamp(19px,3.6vw,23px);line-height:1.4}
#rest{visibility:hidden}
#card #from{margin-top:6px;font-style:italic;opacity:0;transition:opacity 1.5s}
#card #from.show{opacity:.85}
#card small{display:block;margin-top:8px;font-size:15px;opacity:.6}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;transition-delay:0s!important}}
</style>
</head>
<body>
<canvas id="c" aria-label="A garden of flowers blooming at dawn"></canvas>
<section id="intro">
  <h1 id="h1">For you</h1>
  <p>A little garden that blooms when you open it.</p>
  <button id="open" type="button">Open</button>
</section>
<div id="bar"><button id="re" type="button">Replant</button></div>
<div id="card" role="note">
  <h2 id="to">For you</h2>
  <p><span id="typed"></span><span id="rest"></span></p>
  <p id="from"></p>
  <small>Tap anywhere to plant more.</small>
</div>
<script>
const NAME="",FROM="",NOTE="Some people make ordinary days feel softer just by being in them. You’re one of those people. This little garden is small, but every flower in it is for you.";
const $=id=>document.getElementById(id),c=$('c'),x=c.getContext('2d'),RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const TO=NAME?"For "+NAME:"For you";document.title=TO;$('h1').textContent=TO;$('to').textContent=TO;$('rest').textContent=NOTE;
const R=(a,b)=>a+Math.random()*(b-a),clamp=t=>Math.min(Math.max(t,0),1),ease=t=>{t=clamp(t);return t*t*(3-2*t)},back=t=>{t=clamp(t)-1;return t*t*(2.7*t+1.7)+1};
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),mix=(a,b,t)=>{const A=hex(a),B=hex(b);return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join()+')'},al=(h,a)=>'rgba('+hex(h).join()+','+a+')';
let th={};
function readTheme(){const s=getComputedStyle(document.documentElement);['sky1','sky2','glow','hill1','hill2','stem'].forEach(k=>th[k]=s.getPropertyValue('--'+k).trim());th.dark=hex(th.sky1)[0]<80}
readTheme();matchMedia('(prefers-color-scheme:dark)').addEventListener('change',readTheme);
new MutationObserver(readTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
const fl=[];let W=innerWidth,H=innerHeight,D=1,started=false,go=0,last=0;
function size(){const w=W,h=H,m0=Math.min(w,h);D=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);const m=Math.min(W,H);fl.forEach(f=>{f.x*=W/w;f.by*=H/h;f.ty*=H/h;f.r*=m/m0;f.bend*=m/m0})}
addEventListener('resize',size);size();
const gy=px=>H*.8+Math.sin(px/W*5+1)*H*.025;
const PAL=[
[['#ff6f9f','#ffc4da','#fff0b0'],['#ffffff','#ffe8f1','#ffe27a'],['#a67cff','#e6dbff','#fff0b0'],['#ffa63d','#ffe1a6','#fff4c8']],
[['#ff5f8f','#ffa8c5','#fff0b0'],['#ffb02e','#ffd98a','#fff3c4'],['#9b6bff','#d2bcff','#f6eeff'],['#ff6b5e','#ffb3a8','#fff0b0']],
[['#c2184b','#f06292','#ffc2d4'],['#e8456a','#ff9bb0','#ffd8e2'],['#8e24aa','#cf8ae0','#f0d4f7'],['#f08a4b','#ffc08a','#ffe3c8']],
[['#fff6fa','#ffd0e1','#ff8fb5']]];
function fillG(f,L){const g=x.createLinearGradient(0,0,0,-L*1.15);g.addColorStop(0,f.p[2]);g.addColorStop(.3,f.p[1]);g.addColorStop(1,f.p[0]);x.fillStyle=g}
const HEAD=[
(f,b,r)=>{for(let k=0;k<2;k++){const s=k?.72:1,o=k?Math.PI/f.n:0,L=r*s*b,w=r*.3*s*Math.min(1,b*1.2);for(let i=0;i<f.n;i++){x.save();x.rotate(i*6.2832/f.n+o+f.rot+(1-b)*1.2*(k?-1:1));fillG(f,L);x.beginPath();x.ellipse(0,-L*.6,w,L*.6,0,0,6.28);x.fill();x.restore()}}
 x.fillStyle='#f6c342';x.beginPath();x.arc(0,0,r*.2*b,0,6.28);x.fill();x.fillStyle='rgba(120,60,0,.35)';for(let i=0;i<7;i++){const a=i*2.4,d=r*.07*b*(i%3+1)/2;x.beginPath();x.arc(Math.cos(a)*d,Math.sin(a)*d,r*.014,0,6.28);x.fill()}},
(f,b,r)=>{const L=r*1.15*b,w=r*.5*b;[-1,1,0].forEach(d=>{x.save();x.rotate(d*b*.5);fillG(f,L);x.beginPath();x.moveTo(0,0);x.quadraticCurveTo(-w,-L*.55,0,-L);x.quadraticCurveTo(w,-L*.55,0,0);x.fill();x.restore()})},
(f,b,r)=>{[f.p[2],f.p[1],f.p[0]].forEach((col,k)=>{const rad=r*(.6-k*.16)*b,d=r*(.42-k*.14)*b;for(let i=0;i<5;i++){const a=i*1.2566+k*.7+f.rot;x.fillStyle=col;x.strokeStyle='rgba(70,0,35,.22)';x.lineWidth=1;x.beginPath();x.arc(Math.cos(a)*d,Math.sin(a)*d,rad,0,6.28);x.fill();x.stroke()}});
 x.strokeStyle='rgba(70,0,35,.4)';x.lineWidth=Math.max(1,r*.022);x.beginPath();for(let i=0;i<36;i++){const a=i*.5,d=r*.011*i*b;i?x.lineTo(Math.cos(a)*d,Math.sin(a)*d):x.moveTo(0,0)}x.stroke()},
(f,b,r)=>{const L=r*1.05*b,w=r*.42*b;for(let i=0;i<5;i++){x.save();x.rotate(i*1.2566+f.rot+(1-b)*1.5);fillG(f,L);x.beginPath();x.moveTo(0,0);x.bezierCurveTo(-w*1.1,-L*.25,-w*.95,-L*.98,-w*.12,-L*.9);x.lineTo(0,-L*.78);x.lineTo(w*.12,-L*.9);x.bezierCurveTo(w*.95,-L*.98,w*1.1,-L*.25,0,0);x.fill();x.restore()}
 x.strokeStyle=f.p[2];x.fillStyle='#ffd45e';x.lineWidth=1;for(let i=0;i<9;i++){const a=i*.7+f.rot,d=r*.32*b,px=Math.cos(a)*d,py=Math.sin(a)*d;x.beginPath();x.moveTo(0,0);x.lineTo(px,py);x.stroke();x.beginPath();x.arc(px,py,r*.03,0,6.28);x.fill()}}];
function pt(f,p,sw){const cy=(f.by+f.ty)/2,ex=f.x+sw*p,ey=f.by+(f.ty-f.by)*p,a=(1-p)*(1-p),m=2*(1-p)*p,d=p*p;return[a*f.x+m*(f.x+f.bend*p)+d*ex,a*f.by+m*(f.by+(cy-f.by)*p)+d*ey]}
function leaf(px,py,s,d,col){x.save();x.translate(px,py);x.rotate(d*.7);x.scale(s,s);x.fillStyle=col;x.beginPath();x.moveTo(0,0);x.quadraticCurveTo(d*14,-16,d*34,-6);x.quadraticCurveTo(d*16,6,0,0);x.fill();x.restore()}
function drawFlower(f,now){
 const t=(now-f.t0)/f.dur;if(t<0)return;
 const p=ease(t/.55),sw=Math.sin(now/1000*1.1+f.seed)*5*p;
 x.strokeStyle=th.stem;x.lineWidth=Math.max(2,f.r*.09);x.lineCap='round';x.beginPath();
 for(let i=0;i<=24;i++){const q=pt(f,p*i/24,sw);i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1])}x.stroke();
 [[.3,1],[.55,-1]].forEach(([at,dir])=>{const s=ease((p-at)*3.5);if(s>0){const q=pt(f,at,sw);leaf(q[0],q[1],s*f.r/30,dir,th.stem)}});
 const h=pt(f,p,sw),b=back((t-.5)/.5),r=f.r;
 x.save();x.translate(h[0],h[1]);x.rotate(Math.sin(now/1000+f.seed)*.05);
 if(b<.25){const s=ease(t/.55);x.fillStyle=f.p[1];x.beginPath();x.ellipse(0,-r*.1*s,r*.17*s,r*.3*s,0,0,6.28);x.fill();x.fillStyle=th.stem;x.beginPath();x.ellipse(0,r*.03*s,r*.18*s,r*.13*s,0,0,6.28);x.fill()}
 if(b>0)HEAD[f.k](f,b,r);
 x.restore();
}
function plant(px,py,o={}){
 const m=Math.min(W,H),by=gy(px)+R(4,H*.05),k=o.k??(Math.random()*4|0),P=PAL[k];
 fl.push({x:px,by,ty:o.h?by-o.h:(py!==undefined&&py<by-m*.12?py:by-R(m*.2,m*.46)),bend:R(-1,1)*m*.07,r:(o.r||R(.042,.072))*m,n:5+(Math.random()*7|0),k,p:P[Math.random()*P.length|0],t0:performance.now()+(o.d||0),dur:RM?900:R(3800,5400),seed:R(0,9),rot:R(0,6.28)});
 if(fl.length>45)fl.shift();
}
function seed(){fl.length=0;const m=Math.min(W,H);plant(W/2,undefined,{k:2,r:.1,h:m*.5,d:200});
 for(let i=1;i<=12;i++)plant(W/2+(i%2?1:-1)*Math.ceil(i/2)*W*.07+R(-12,12),undefined,{d:600+i*380})}
const stars=Array.from({length:70},()=>({x:Math.random(),y:Math.random()*.55,s:R(.5,1.6),p:R(0,6)})),
dust=Array.from({length:45},()=>({x:Math.random(),y:Math.random(),s:R(.6,1.8),v:R(.008,.03),p:R(0,6)})),
pc=['#ffc4da','#ffe3ef','#ffd0e1','#e6dbff','#ffb8ab'],
petals=Array.from({length:26},()=>({x:Math.random(),y:Math.random(),s:R(4,8),vy:R(.03,.07),p:R(0,6)})),
BF=['#ff9bc2','#ffc34d','#b99bff','#7fd0ff'].map((c,i)=>({c,ph:i*1.9,sp:R(.7,1.1),s:R(.8,1.2)}));
function bfly(b,now,a){const t=now/1000*b.sp+b.ph,px=W*(.5+.4*Math.sin(t*.7))+Math.sin(t*3)*8,py=H*(.4+.18*Math.sin(t*.9+1))+Math.sin(t*5)*6,fp=Math.abs(Math.sin(now/90+b.ph));
 x.save();x.translate(px,py);x.rotate(Math.cos(t*.7)*.4);x.scale(b.s,b.s);x.globalAlpha=a*.9;x.fillStyle=b.c;
 [-1,1].forEach(s=>{x.save();x.scale(s*(.2+.8*fp),1);x.beginPath();x.ellipse(8,-6,8,12,-.5,0,6.28);x.fill();x.beginPath();x.ellipse(6,8,5,8,.5,0,6.28);x.fill();x.restore()});
 x.fillStyle='#3b2038';x.fillRect(-1,-10,2,20);x.restore();x.globalAlpha=1}
function frame(now){
 const dt=Math.min((now-last)/1000,.05);last=now;
 const dawn=started?(RM?1:ease((now-go)/7000)):0;
 let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,mix('#1d1840',th.sky1,dawn));g.addColorStop(1,mix('#4a2d68',th.sky2,dawn));x.fillStyle=g;x.fillRect(0,0,W,H);
 const sa=th.dark?0.9:1-dawn;
 if(sa>.02){x.fillStyle='#fff';stars.forEach(s=>{x.globalAlpha=sa*(.3+.7*Math.abs(Math.sin(now/900+s.p)));x.beginPath();x.arc(s.x*W,s.y*H,s.s,0,6.28);x.fill()});x.globalAlpha=1}
 g=x.createRadialGradient(W*.8,H*.2,0,W*.8,H*.2,Math.min(W,H)*.55);g.addColorStop(0,al(th.glow,1));g.addColorStop(1,al(th.glow,0));x.globalAlpha=.15+.55*dawn;x.fillStyle=g;x.fillRect(0,0,W,H);x.globalAlpha=1;
 x.fillStyle=th.hill2;x.beginPath();x.moveTo(0,H);for(let i=0;i<=W+12;i+=12)x.lineTo(i,gy(i)-H*.02);x.lineTo(W,H);x.fill();
 fl.forEach(f=>drawFlower(f,now));
 x.fillStyle=th.hill1;x.beginPath();x.moveTo(0,H);for(let i=0;i<=W+12;i+=12)x.lineTo(i,gy(i)+H*.05+Math.sin(i/90)*4);x.lineTo(W,H);x.fill();
 const sg=1-clamp(dawn*3);
 if(sg>.01){const sx=W/2,sy=gy(W/2)-10,r=34+8*Math.sin(now/450);g=x.createRadialGradient(sx,sy,0,sx,sy,r);g.addColorStop(0,'rgba(255,236,170,.95)');g.addColorStop(1,'rgba(255,200,230,0)');x.globalAlpha=sg;x.fillStyle=g;x.fillRect(sx-r,sy-r,r*2,r*2);x.globalAlpha=1}
 if(started&&dawn>.4)BF.forEach(b=>bfly(b,now,clamp((dawn-.4)*3)));
 x.fillStyle=th.glow;dust.forEach(d=>{d.y-=d.v*dt;if(d.y<0){d.y=1;d.x=Math.random()}x.globalAlpha=.2+.5*Math.abs(Math.sin(now/700+d.p));x.beginPath();x.arc((d.x+Math.sin(now/2000+d.p)*.01)*W,d.y*H,d.s,0,6.28);x.fill()});
 petals.forEach((q,i)=>{if(started){q.y+=q.vy*dt;if(q.y>1.05)q.y=-.05}x.save();x.translate((q.x+Math.sin(now/1500+q.p)*.03)*W,q.y*H);x.rotate(now/900+q.p);x.fillStyle=pc[i%5];x.globalAlpha=.8*clamp(dawn*2);x.beginPath();x.ellipse(0,0,q.s,q.s*.55,0,0,6.28);x.fill();x.restore()});
 x.globalAlpha=1;requestAnimationFrame(frame);
}
function note(){const a=$('typed'),b=$('rest'),s=NOTE;$('card').classList.add('show');let i=0;
 const end=()=>{a.textContent=s;b.textContent='';if(FROM){$('from').textContent='— '+FROM;$('from').classList.add('show')}};
 if(RM){end();return}
 const id=setInterval(()=>{i++;a.textContent=s.slice(0,i);b.textContent=s.slice(i);if(i>=s.length){clearInterval(id);end()}},45)}
$('open').onclick=()=>{started=true;go=performance.now();$('intro').classList.add('gone');$('bar').classList.add('show');seed();setTimeout(note,RM?0:5200)};
$('re').onclick=seed;
c.addEventListener('pointerdown',e=>{if(started)plant(e.clientX,e.clientY)});
requestAnimationFrame(frame);
</script>
</body>
</html>
